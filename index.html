<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPNS Flashcard · TIU / TWK / TKP</title>
  <link rel="stylesheet" href="style.css">

  <link rel="icon" type="image/x-icon" href="assets/endmin.ico">
  <link rel="shortcut icon" href="assets/endmin.ico">
</head>
<body>
  <header class="app-header">
    <h1>📚 CPNS Flashcard</h1>
    <p class="subhead">TIU · TWK · TKP · Campuran</p>
  </header>

  <main class="container">
    <nav class="menu">
      <button class="menu-btn active" data-category="tiu">🧠 TIU <span class="count" id="countTiu"></span></button>
      <button class="menu-btn" data-category="twk">🇮🇩 TWK <span class="count" id="countTwk"></span></button>
      <button class="menu-btn" data-category="tkp">⭐ TKP <span class="count" id="countTkp"></span></button>
      <button class="menu-btn" data-category="mixed">🔀 Campuran</button>
    </nav>

    <section class="flashcard-section">
      <div class="card" id="flashcard">
        <div class="card-inner" id="cardInner">
          <div class="card-front">
            <span class="badge" id="categoryBadge">TIU</span>
            <p class="question" id="questionText">Loading question...</p>
            <div class="options" id="optionsContainer"></div>
            <div class="hint" id="frontHint">Pilih salah satu jawaban di atas</div>
          </div>
          <div class="card-back">
            <span class="badge" id="backBadge">TIU</span>
            <p class="answer" id="answerText"></p>
            <div class="extra-features">
              <div class="feature-box" id="explanationBox">
                <span class="feature-icon">📘</span>
                <span class="feature-label">Penjelasan:</span>
                <span class="feature-content" id="explanationText"></span>
              </div>
              <div class="feature-box" id="formulaBox">
                <span class="feature-icon">⚡</span>
                <span class="feature-label">Rumus Cepat:</span>
                <span class="feature-content" id="formulaText"></span>
              </div>
              <div class="feature-box" id="keywordBox">
                <span class="feature-icon">🔑</span>
                <span class="feature-label">Kata Kunci:</span>
                <span class="feature-content" id="keywordText"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="nav-controls">
        <button id="prevBtn" class="nav-btn">◀ Sebelumnya</button>
        <span id="cardCounter" class="counter">1 / 1</span>
        <button id="nextBtn" class="nav-btn">Selanjutnya ▶</button>
      </div>

      <div class="action-controls">
        <button id="flipBtn" class="action-btn">🔄 Lihat Jawaban</button>
        <button id="shuffleBtn" class="action-btn">🎲 Acak</button>
      </div>
    </section>
  </main>

<footer class="app-footer">
    <p>Klik opsi jawaban untuk melihat pembahasan · Latihan CPNS interaktif</p>
  <p>For personal study use only.</p>
  <p class="credit">
    Made by
    <a href="https://www.instagram.com/fintisalsabila?obrf=eTRsenQxNzRpOXk4"
       target="_blank"
       rel="noopener noreferrer">Finti Salsabila</a>
  </p>  
</footer>

  <!-- File soal (urutan penting: tiu, twk, tkp, campuran) -->
  <script src="soal-tiu.js"></script>
  <script src="soal-twk.js"></script>
  <script src="soal-tkp.js"></script>
  <script src="soal-campuran.js"></script>
  <script src="script.js"></script>
</body>
</html>
